<script>
const PARTS=[{"id": "A", "ms": "Perkhidmatan Awam", "zh": "公共服务", "q": [{"n": 1, "ms": "Apakah perasaan anda apabila tidak dilayan dengan baik semasa berurusan di sebuah agensi kerajaan?", "zh": "当你在政府机构办理事务时受到不友善的对待，你会有什么感受？", "o": [{"k": "A", "ms": "Bangga kerana mendapat perhatian.", "zh": "因为受到关注而感到骄傲。"}, {"k": "B", "ms": "Gembira kerana dapat menunggu lebih lama.", "zh": "因为可以等待更久而感到高兴。"}, {"k": "C", "ms": "Kecewa kerana tidak mendapat layanan yang sewajarnya.", "zh": "因为没有受到应有的对待而感到失望。"}, {"k": "D", "ms": "Bersyukur kerana urusan menjadi lebih sukar.", "zh": "因为办理事务变得更困难而感到感恩。"}], "a": "C"}, {"n": 2, "ms": "Anda melihat seorang pelanggan memotong barisan di kaunter. Apakah tindakan yang paling sesuai?", "zh": "你看到一名顾客在服务柜台前插队。最恰当的做法是什么？", "o": [{"k": "A", "ms": "Menegurnya dengan sopan supaya mengikut giliran.", "zh": "有礼貌地提醒他按次序排队。"}, {"k": "B", "ms": "Memarahinya dengan suara yang kuat.", "zh": "大声责骂他。"}, {"k": "C", "ms": "Turut memotong barisan untuk mendapat layanan segera.", "zh": "也插队，以便更快获得服务。"}, {"k": "D", "ms": "Menghalangnya daripada berurusan sepanjang hari.", "zh": "阻止他一整天办理事务。"}], "a": "A"}, {"n": 3, "ms": "Seorang pelanggan masih enggan mematuhi peraturan walaupun telah ditegur dengan sopan. Apakah tindakan anda seterusnya?", "zh": "一名顾客在受到礼貌提醒后仍然不愿遵守规则。接下来你应该怎么做？", "o": [{"k": "A", "ms": "Mengajaknya bertengkar di luar pejabat.", "zh": "叫他到办公室外争吵。"}, {"k": "B", "ms": "Mengambil barang peribadinya sebagai hukuman.", "zh": "拿走他的私人物品作为惩罚。"}, {"k": "C", "ms": "Menyebarkan gambarnya untuk memalukannya.", "zh": "散播他的照片，让他难堪。"}, {"k": "D", "ms": "Memaklumkan perkara tersebut kepada pegawai bertugas.", "zh": "向值班人员反映这件事。"}], "a": "D"}, {"n": 4, "ms": "Antara berikut, yang manakah dapat meningkatkan kualiti perkhidmatan awam?", "zh": "以下哪项能够提升公共服务的素质？", "o": [{"k": "A", "ms": "Membiarkan pelanggan menunggu tanpa penjelasan.", "zh": "让顾客等待，却不作任何解释。"}, {"k": "B", "ms": "Memberikan latihan komunikasi dan pengurusan pelanggan kepada kakitangan.", "zh": "为职员提供沟通与顾客服务管理培训。"}, {"k": "C", "ms": "Mengutamakan pelanggan yang dikenali sahaja.", "zh": "只优先处理熟人的事务。"}, {"k": "D", "ms": "Mengabaikan pertanyaan pelanggan yang kurang jelas.", "zh": "不理会表达不清楚的顾客所提出的问题。"}], "a": "B"}, {"n": 5, "ms": "Apakah amalan yang menunjukkan keadilan dalam perkhidmatan awam?", "zh": "哪一种做法体现公共服务中的公平？", "o": [{"k": "A", "ms": "Memberikan layanan lebih baik kepada rakan sendiri.", "zh": "为自己的朋友提供更好的服务。"}, {"k": "B", "ms": "Melayan pelanggan berdasarkan pakaian mereka.", "zh": "根据顾客的衣着给予不同的服务。"}, {"k": "C", "ms": "Memberikan layanan yang saksama tanpa mengira latar belakang pelanggan.", "zh": "不论顾客背景如何，都给予公平的服务。"}, {"k": "D", "ms": "Mendahulukan pelanggan yang menawarkan hadiah.", "zh": "优先处理送礼顾客的事务。"}], "a": "C"}]}, {"id": "B", "ms": "Amalan Bumi Hijau", "zh": "环保实践", "q": [{"n": 6, "ms": "Apakah perasaan yang paling wajar apabila melihat laut dipenuhi sampah plastik?", "zh": "看到海洋布满塑料垃圾时，最恰当的感受是什么？", "o": [{"k": "A", "ms": "Bangga kerana manusia menggunakan banyak plastik.", "zh": "因为人类使用大量塑料而感到骄傲。"}, {"k": "B", "ms": "Sedih kerana keindahan dan kebersihan laut terjejas.", "zh": "因为海洋的美丽与清洁受到破坏而感到难过。"}, {"k": "C", "ms": "Gembira kerana permukaan laut kelihatan berwarna-warni.", "zh": "因为海面看起来色彩缤纷而感到高兴。"}, {"k": "D", "ms": "Berpuas hati kerana sampah tidak lagi berada di rumah.", "zh": "因为垃圾不再留在家里而感到满意。"}], "a": "B"}, {"n": 7, "ms": "Apakah tindakan yang paling sesuai untuk mengurangkan penggunaan beg plastik semasa membeli-belah?", "zh": "购物时，哪一种做法最适合减少塑料袋的使用？", "o": [{"k": "A", "ms": "Meminta dua beg plastik untuk setiap barang.", "zh": "每件物品都要求使用两个塑料袋。"}, {"k": "B", "ms": "Menggunakan beg plastik baharu setiap kali membeli-belah.", "zh": "每次购物都使用新的塑料袋。"}, {"k": "C", "ms": "Membuang beg plastik selepas sekali digunakan.", "zh": "塑料袋用过一次就丢弃。"}, {"k": "D", "ms": "Membawa beg guna semula dari rumah.", "zh": "从家里携带可重复使用的购物袋。"}], "a": "D"}, {"n": 8, "ms": "Anda mempunyai botol plastik kosong yang boleh dikitar semula. Apakah tindakan yang paling sesuai?", "zh": "你有一个可回收的空塑料瓶。最恰当的做法是什么？", "o": [{"k": "A", "ms": "Mengasingkannya dan memasukkannya ke dalam tong kitar semula yang sesuai.", "zh": "将它分类，并放入适当的回收桶。"}, {"k": "B", "ms": "Membuangnya ke dalam longkang berhampiran rumah.", "zh": "把它丢进住家附近的沟渠。"}, {"k": "C", "ms": "Meninggalkannya di tepi pantai.", "zh": "把它留在海边。"}, {"k": "D", "ms": "Mencampakkannya ke dalam sungai.", "zh": "把它扔进河里。"}], "a": "A"}, {"n": 9, "ms": "Penduduk berganding bahu membersihkan pantai yang dipenuhi sampah. Apakah nilai yang paling jelas ditunjukkan?", "zh": "居民齐心协力清理布满垃圾的海滩。这最明显地体现了什么价值观？", "o": [{"k": "A", "ms": "Keberanian.", "zh": "勇敢。"}, {"k": "B", "ms": "Berdikari.", "zh": "自立。"}, {"k": "C", "ms": "Kerjasama.", "zh": "合作。"}, {"k": "D", "ms": "Harga diri.", "zh": "自尊。"}], "a": "C"}, {"n": 10, "ms": "Apakah tindakan yang menunjukkan nilai bertanggungjawab semasa berkelah di pantai?", "zh": "在海边野餐时，哪一种行为体现负责任的价值观？", "o": [{"k": "A", "ms": "Menanam semua sampah di dalam pasir.", "zh": "把所有垃圾埋在沙里。"}, {"k": "B", "ms": "Mengumpulkan sampah sendiri dan membuangnya di tempat yang sesuai.", "zh": "收集自己制造的垃圾，并丢弃在适当的地方。"}, {"k": "C", "ms": "Meninggalkan sampah untuk dibersihkan oleh orang lain.", "zh": "留下垃圾，让别人清理。"}, {"k": "D", "ms": "Membuang sampah ke laut apabila tiada orang melihat.", "zh": "趁没人看见时把垃圾丢进海里。"}], "a": "B"}]}, {"id": "C", "ms": "Tanggungjawab Sosial", "zh": "社会责任", "q": [{"n": 11, "ms": "Apakah bentuk tanggungjawab sosial yang dilaksanakan oleh Encik Abdul Rahman?", "zh": "Abdul Rahman先生履行了哪一种社会责任？", "o": [{"k": "A", "ms": "Menyediakan kemudahan pembelajaran dan akses maklumat kepada penduduk.", "zh": "为居民提供学习设施及获取资讯的途径。"}, {"k": "B", "ms": "Membina kemudahan untuk kegunaan keluarganya sahaja.", "zh": "只为自己的家人建设设施。"}, {"k": "C", "ms": "Menggunakan semua keuntungan untuk percutian peribadi.", "zh": "把所有利润用于私人旅行。"}, {"k": "D", "ms": "Menghalang penduduk daripada menggunakan kemudahan syarikat.", "zh": "阻止居民使用公司的设施。"}], "a": "A"}, {"n": 12, "ms": "Apakah nilai yang paling jelas diamalkan oleh Encik Abdul Rahman melalui bantuannya kepada golongan yang kurang bernasib baik?", "zh": "Abdul Rahman先生帮助有需要的人，最明显地体现了什么价值观？", "o": [{"k": "A", "ms": "Berdikari.", "zh": "自立。"}, {"k": "B", "ms": "Keberanian.", "zh": "勇敢。"}, {"k": "C", "ms": "Harga diri.", "zh": "自尊。"}, {"k": "D", "ms": "Baik hati.", "zh": "仁爱。"}], "a": "D"}, {"n": 13, "ms": "Bagaimanakah penduduk dapat menunjukkan nilai berterima kasih terhadap sumbangan tersebut?", "zh": "居民可以怎样对这项捐助表达感恩？", "o": [{"k": "A", "ms": "Mendesak beliau memberikan lebih banyak hadiah peribadi.", "zh": "强迫他赠送更多私人礼物。"}, {"k": "B", "ms": "Membandingkan sumbangannya untuk mencari kelemahan.", "zh": "比较他的捐助，刻意挑出不足之处。"}, {"k": "C", "ms": "Mengucapkan penghargaan serta menjaga kemudahan yang disediakan.", "zh": "表达谢意，并爱护所提供的设施。"}, {"k": "D", "ms": "Menganggap bantuan tersebut tidak perlu dihargai.", "zh": "认为这项帮助不值得感激。"}], "a": "C"}, {"n": 14, "ms": "Apakah kepentingan penglibatan pelbagai pihak dalam membantu golongan yang kurang bernasib baik?", "zh": "各方共同帮助有需要的群体，有什么重要意义？", "o": [{"k": "A", "ms": "Membolehkan semua tanggungjawab diserahkan kepada seorang penderma.", "zh": "可以把所有责任交给一名捐助者。"}, {"k": "B", "ms": "Membolehkan lebih banyak keperluan golongan tersebut dipenuhi.", "zh": "可以满足这些群体更多的需求。"}, {"k": "C", "ms": "Menggalakkan persaingan untuk mendapatkan pujian semata-mata.", "zh": "鼓励各方纯粹为了获得赞扬而竞争。"}, {"k": "D", "ms": "Menjadikan bantuan hanya tertumpu kepada kenalan sendiri.", "zh": "使援助只集中于自己的熟人。"}], "a": "B"}, {"n": 15, "ms": "Bagaimanakah penduduk dapat memastikan perpustakaan sumbangan itu terus dimanfaatkan bersama?", "zh": "居民应该怎样确保大家能够持续使用获捐建的图书馆？", "o": [{"k": "A", "ms": "Menjaga buku dan memulangkannya mengikut peraturan.", "zh": "爱护书籍，并按照规定归还。"}, {"k": "B", "ms": "Menyimpan buku pinjaman sebagai milik sendiri.", "zh": "把借来的书据为己有。"}, {"k": "C", "ms": "Membenarkan kanak-kanak merosakkan peralatan.", "zh": "允许儿童破坏设备。"}, {"k": "D", "ms": "Menggunakan ruang perpustakaan untuk menyimpan barang peribadi sahaja.", "zh": "把图书馆空间只用来存放私人物品。"}], "a": "A"}], "sit": {"ms": "Encik Abdul Rahman ialah seorang ahli korporat yang berjaya. Beliau menggunakan sebahagian keuntungan syarikatnya untuk membantu penduduk yang kurang bernasib baik di kawasan pedalaman dengan membina pusat internet dan perpustakaan.", "zh": "Abdul Rahman先生是一名成功的企业界人士。他利用公司的部分利润，在内陆地区建设互联网中心和图书馆，帮助有需要的居民。"}}, {"id": "D", "ms": "Adab dalam Majlis", "zh": "场合礼仪", "q": [{"n": 16, "ms": "Apakah perasaan yang paling sesuai apabila anda mengamalkan adab yang baik semasa menghadiri rumah terbuka Hari Raya?", "zh": "出席开斋节门户开放活动时，若你表现得有礼貌，最恰当的感受是什么？", "o": [{"k": "A", "ms": "Marah kerana perlu menghormati tetamu lain.", "zh": "因为必须尊重其他宾客而感到生气。"}, {"k": "B", "ms": "Malu kerana bersikap sopan kepada tuan rumah.", "zh": "因为礼貌对待主人而感到羞耻。"}, {"k": "C", "ms": "Kecewa kerana tidak dapat bertindak sesuka hati.", "zh": "因为不能随心所欲而感到失望。"}, {"k": "D", "ms": "Gembira kerana dapat menghormati tuan rumah dan tetamu lain.", "zh": "因为能够尊重主人及其他宾客而感到高兴。"}], "a": "D"}, {"n": 17, "ms": "Anda dijemput menghadiri majlis rasmi yang menetapkan pakaian batik. Apakah tindakan yang paling sesuai?", "zh": "你受邀出席一场规定穿着蜡染服装的正式活动。最恰当的做法是什么？", "o": [{"k": "A", "ms": "Memakai pakaian sukan kerana lebih selesa.", "zh": "穿运动服，因为比较舒服。"}, {"k": "B", "ms": "Memakai pakaian batik yang kemas mengikut ketetapan majlis.", "zh": "按照活动规定，穿着整齐的蜡染服装。"}, {"k": "C", "ms": "Memakai pakaian tidur kerana tidak mahu membazir masa.", "zh": "穿睡衣，因为不想浪费时间。"}, {"k": "D", "ms": "Mengabaikan ketetapan pakaian kerana hadir sebagai tetamu.", "zh": "因为自己是宾客，所以不必遵守服装规定。"}], "a": "B"}, {"n": 18, "ms": "Apakah adab bercakap yang sesuai semasa menghadiri majlis tidak rasmi?", "zh": "出席非正式聚会时，哪一种说话方式最恰当？", "o": [{"k": "A", "ms": "Mencelah setiap kali orang lain bercakap.", "zh": "每当别人说话时就插嘴。"}, {"k": "B", "ms": "Menggunakan kata-kata kasar untuk bergurau.", "zh": "用粗俗的言语开玩笑。"}, {"k": "C", "ms": "Bercakap dengan sopan serta memberikan peluang kepada orang lain untuk bersuara // ===== Google Form (optional) — see instructions; leave blank to disable =====
// Link of the Google Sheet published as CSV (File > Share > Publish to web > Responses sheet > CSV). Leave blank to disable the list.
const SHEET_CSV="";
// Sheet columns must be in this order: Timestamp, Nama, Kelas, A, B, C, D, Jumlah
const FORM={action:"https://docs.google.com/forms/d/e/1FAIpQLSffcNqHAU5c4wXqtnv0gndXLinAtlU16pZ76N7J5NceaLT9-A/formResponse",entry:{name:"entry.1968942705",cls:"entry.347319560",A:"entry.1881739456",B:"entry.2141722895",C:"entry.1432424179",D:"entry.134112624",total:"entry.859265829"}};
const ans={};let cur=0,done=false,mine=null,rows=[];
const $=s=>document.querySelector(s),esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(){
 $('#parts').innerHTML=PARTS.map((p,i)=>`<section class="card part ${i==cur?'':'hide'}" id="p${i}">
 <h2 class="ph">Bahagian ${p.id}: ${p.ms}<small>${p.id} 部分：${p.zh}</small></h2>
 ${p.sit?`<div class="sit"><p>Baca situasi berikut untuk menjawab Soalan 11 hingga 15.</p><p>阅读以下情境，然后回答第11至15题。</p><p>${esc(p.sit.ms)}</p><p>${esc(p.sit.zh)}</p></div>`:''}
 ${p.q.map(q=>`<div class="q" id="q${q.n}"><div class="qt"><div class="qn">${q.n}</div><div><p><b>${esc(q.ms)}</b></p><p class="zh">${esc(q.zh)}</p></div></div>
 ${q.o.map(o=>`<label class="opt" data-q="${q.n}" data-k="${o.k}"><input type="radio" name="q${q.n}" value="${o.k}"><div><span class="k">${o.k}.</span> ${esc(o.ms)}<div class="zh">${esc(o.zh)}</div></div></label>`).join('')}
 <div class="tag" id="t${q.n}"></div></div>`).join('')}
 <div class="nav"><button class="b g" onclick="go(${i-1})" ${i==0?'disabled':''}>← Sebelumnya / 上一部分</button>
 ${i<3?`<button class="b" onclick="go(${i+1})">Seterusnya / 下一部分 →</button>`:`<button class="b" id="sub" onclick="submit()">Hantar / 提交 ✓</button>`}</div></section>`).join('')+`<section class="card part hide" id="p4"><h2 class="ph">Senarai Penghantaran<small>提交名单与成绩（匿名 / Tanpa nama）</small></h2>
 <div class="bt"><select id="fc" onchange="drawBoard()"><option value="">Semua kelas / 所有班级</option></select><button class="b g" onclick="loadBoard()">↻ Muat semula / 刷新</button></div>
 <div class="tw" id="bd"></div></section>`;
 document.querySelectorAll('.opt input').forEach(r=>r.onchange=()=>{ans[r.name.slice(1)]=r.value;mark();});
 tabs();
}
function tabs(){
 $('#tabs').innerHTML=PARTS.map((p,i)=>{const n=p.q.filter(q=>ans[q.n]).length;
 return `<button class="tab ${i==cur?'on':''} ${n==p.q.length?'done':''}" onclick="go(${i})"><b>${p.id}</b><span>${n}/${p.q.length}</span></button>`}).join('')+`<button class="tab ${cur==4?'on':''}" onclick="go(4)"><b>👥</b><span>Senarai / 名单</span></button>`;
}
function mark(){document.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',ans[o.dataset.q]===o.dataset.k));tabs();}
function go(i){if(i<0||i>4)return;cur=i;if(i==4)loadBoard();document.querySelectorAll('.part').forEach((s,j)=>s.classList.toggle('hide',j!=i));tabs();scrollTo({top:0,behavior:'smooth'});}
function submit(){
 const nm=$('#nm'),cl=$('#cl');let bad=false;
 [nm,cl].forEach(e=>{const v=!e.value.trim();e.classList.toggle('err',v);bad=bad||v});
 if(bad){scrollTo({top:0,behavior:'smooth'});alert('Sila isi nama penuh dan kelas.\n请填写全名和班级。');return;}
 const un=PARTS.flatMap(p=>p.q).filter(q=>!ans[q.n]).map(q=>q.n);
 if(un.length&&!confirm(`Soalan belum dijawab / 尚未作答: ${un.join(', ')}\nHantar juga? / 仍要提交吗？`))return;
 done=true;const sc={};let tot=0;
 PARTS.forEach(p=>{sc[p.id]=0;p.q.forEach(q=>{
  const ok=ans[q.n]===q.a;if(ok){sc[p.id]++;tot++}
  document.querySelectorAll(`.opt[data-q="${q.n}"]`).forEach(o=>{o.querySelector('input').disabled=true;
   if(o.dataset.k===q.a)o.classList.add('right');else if(o.dataset.k===ans[q.n])o.classList.add('wrong');});
  const t=$('#t'+q.n);t.className='tag '+(ok?'ok':'no');
  t.textContent=ok?'✓ Betul / 正确':`✗ ${ans[q.n]?'Salah / 错误':'Tiada jawapan / 未作答'} — Jawapan betul / 正确答案: ${q.a}`;});});
 document.querySelectorAll('.part').forEach(s=>s.classList.add('locked'));
 nm.disabled=cl.disabled=true;$('#sub').disabled=true;
 const r=$('#res');r.classList.remove('hide');
 r.innerHTML=`<div class="note" style="margin:0 0 6px">${esc(nm.value.trim())} · ${esc(cl.value.trim())}</div><div class="big">${tot} / 20 <small style="font-size:1rem">(${tot*5}%)</small></div><div>Markah anda / 你的成绩</div>
 <div class="ps">${PARTS.map(p=>`<span>${p.id}: ${sc[p.id]}/5</span>`).join('')}</div>
 <p class="note">Semak jawapan anda pada setiap bahagian di bawah. / 请在下方各部分查看答案。</p>`;
 mine={n:nm.value.trim(),c:cl.value.trim(),s:[sc.A,sc.B,sc.C,sc.D],t:tot};send(nm.value.trim(),cl.value.trim(),sc,tot);setTimeout(loadBoard,4000);scrollTo({top:0,behavior:'smooth'});
}
function send(name,cls,sc,tot){
 if(!FORM.action)return;const e=FORM.entry,f=new URLSearchParams();
 f.append(e.name,name);f.append(e.cls,cls);['A','B','C','D'].forEach(k=>f.append(e[k],sc[k]));f.append(e.total,tot);
 fetch(FORM.action,{method:'POST',mode:'no-cors',body:f}).catch(()=>{});
}
function csv(s){const o=[];let r=[],f='',q=false;for(let i=0;i<s.length;i++){const c=s[i];
 if(q){if(c=='"'&&s[i+1]=='"'){f+='"';i++}else if(c=='"')q=false;else f+=c}
 else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'){r.push(f);o.push(r);r=[];f=''}else if(c!='\r')f+=c}
 if(f||r.length){r.push(f);o.push(r)}return o}
async function loadBoard(){
 const b=$('#bd');
 if(!SHEET_CSV){drawBoard();return}
 b.innerHTML='<p class="note">Memuatkan… / 加载中…</p>';
 try{const r=await fetch(SHEET_CSV+(SHEET_CSV.includes('?')?'&':'?')+'t='+Date.now());
  rows=csv(await r.text()).slice(1).filter(x=>x[1]).map(x=>({n:x[1].trim(),c:(x[2]||'').trim(),s:[3,4,5,6].map(i=>+x[i]||0),t:+x[7]||0,d:x[0]}));
 }catch(e){b.innerHTML='<p class="note">Tidak dapat memuatkan senarai. / 无法加载名单。</p>';return}
 drawBoard();
}
function drawBoard(){
 const b=$('#bd');
 if(!SHEET_CSV&&!mine){b.innerHTML='<p class="note">Senarai belum disambungkan. / 名单尚未连接。</p>';return}
 let L=rows.slice();
 if(mine&&!L.some(x=>x.n==mine.n&&x.c==mine.c&&x.t==mine.t))L.push({...mine,me:1});
 const fc=$('#fc'),cls=[...new Set(L.map(x=>x.c))].sort(),sv=fc.value;
 fc.innerHTML='<option value="">Semua kelas / 所有班级</option>'+cls.map(c=>`<option ${c==sv?'selected':''}>${esc(c)}</option>`).join('');
 if(sv)L=L.filter(x=>x.c==sv);
 L.sort((a,b)=>b.t-a.t);
 b.innerHTML=L.length?`<table><tr><th>#</th><th>Kelas / 班级</th><th>A</th><th>B</th><th>C</th><th>D</th><th>Jumlah / 总分</th></tr>`+
 L.map((x,i)=>`<tr class="${x.me||(mine&&x.n==mine.n&&x.c==mine.c)?'me':''}"><td>${i+1}${x.me||(mine&&x.n==mine.n&&x.c==mine.c)?" ← Anda / 你":""}</td><td>${esc(x.c)}</td>${x.s.map(v=>`<td>${v}/5</td>`).join('')}<td class="t">${x.t}/20</td></tr>`).join('')+'</table>'
 :'<p class="note">Belum ada penghantaran. / 暂无提交记录。</p>';
}
render();
</script>
